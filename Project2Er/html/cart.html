<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloria Food</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css"> 
    <link rel="stylesheet" href="cart.css">

</head>
<body>
    <header>
        <img src="logo.png" alt="Logo" width="120" height="140"> 
        <nav>
            <ul>
                <li><a href="homepage.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="registration.html">Sign up</a></li>
                <li><a href="about.html">About us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Portion size</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Medierranean Delight</td>
                    <td>Large</td>
                    <td><input type="number" value="2" min="1"></td>
                    <td>24$</td>
                    <td><button class="edit-btn">Edit</button> <button class="delete-btn">Delete</button></td>
                </tr>
                <tr>
                    <td>Roasted Tomato & Chickpea Penne</td>
                    <td>Medium</td>
                    <td><input type="number" value="2" min="1"></td>
                    <td>18$</td>
                    <td><button class="edit-btn">Edit</button> <button class="delete-btn">Delete</button></td>
                </tr>
                <tr>
                    <td>Classic Cheeseburger</td>
                    <td>Medium</td>
                    <td><input type="number" value="3" min="1"></td>
                    <td>18$</td>
                    <td><button class="edit-btn">Edit</button> <button class="delete-btn">Delete</button></td>
                </tr>
                <tr>
                    <td>Crispy Chicken & Fries</td>
                    <td>Large</td>
                    <td><input type="number" value="1" min="1"></td>
                    <td>15$</td>
                    <td><button class="edit-btn">Edit</button> <button class="delete-btn">Delete</button></td>
                </tr>
            </tbody>
        </table>
        <br>
        <table border="1">
            <tr>
                <th>Total price</th>
            </tr>
            <tr>
                <td id="total-price"></td>
            </tr>
        </table>
        <br>
        <button type="submit">Proceed to checkout</button>
    </main>
    <footer>
        <p>Foundations of Web Development-Rahic Emir</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script> 
    <script>
        
        const editButtons = document.querySelectorAll('.edit-btn');

        editButtons.forEach(button => {
            button.addEventListener('click', () => {
                const inputField = button.parentElement.parentElement.querySelector('input');
                inputField.value = parseInt(inputField.value) + 1; 
            });
        });

        
        const deleteButtons = document.querySelectorAll('.delete-btn');

        deleteButtons.forEach(button => {
            button.addEventListener('click', () => {
                const row = button.parentElement.parentElement; 
                row.remove(); 

                
                toastr.success('Item deleted successfully!'); 

                
                calculateTotalPrice(); 
            });
        });

       
        function calculateTotalPrice() {
            const priceCells = document.querySelectorAll('td:nth-child(4)'); 
            let totalPrice = 0;
            priceCells.forEach(cell => {
                totalPrice += parseFloat(cell.textContent.replace('$', ''));
            });
            document.getElementById('total-price').textContent = '$' + totalPrice;
        }

        
        calculateTotalPrice(); 
    </script>
</body>
</html>
