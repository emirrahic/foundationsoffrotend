<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="products.css">

</head>
<body>
<header>
    <img src="logo.png" width="120" height="140" alt="pictureoflogo">
    <nav>
        <ul>
            <li><a href="homepage.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="registration.html">Sign up</a></li>
            <li><a href="about.html">About us</a></li>
        </ul>
    </nav>
</header>

<main>
    <div class="container py-5">
        <h1 class="text-center mb-4" style="font-family: Arial, Helvetica, sans-serif;color: #ff8c00; background-color: #fff; font-weight: bold;">Our Products</h1>
        <h3 style="text-align:center;font-weight: bold;">Pick some of our best selling products</h3>
        <br>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4" id="product-list"></div>
    </div>
</main>

<footer>
    <p>Foundations of Web Development-Rahic Emir</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
   
    function loadProducts() {
        fetch('products.json')
            .then(response => response.json())
            .then(data => {
                let productList = document.getElementById('product-list');
                productList.innerHTML = ''; 

                data.forEach(product => {
                    let productCard = `
                        <div class="col">
                            <div class="card h-100">
                                <img src="${product.image}" class="card-img-top" alt="${product.name}">
                                <div class="card-body">
                                    <h5 class="card-title">${product.name}</h5>
                                    <p class="card-text">${product.description}</p>
                                    <select class="form-select mb-3">
                                        <option value="pick" selected>Choose portion size</option>
                                        ${product.sizes.map(size => `<option>${size.size} ${size.price}$</option>`).join('')}
                                    </select>
                                    <button class="btn w-100" style="background-color: #ff8c00; color: white;">Add to Cart</button>
                                </div>
                            </div>
                        </div>
                    `;
                    productList.innerHTML += productCard;
                });
            })
            .catch(error => console.log('Error loading products:', error));
    }

    
    window.onload = loadProducts;
</script>

</body>
</html>


</body>
</html>
