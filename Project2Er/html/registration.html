<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gloria Food</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="registration.css">
</head>
<body>
<header>
    <img src="logo.png" width="120" height="140" alt="pictureoflogo">
    <nav>
        <ul>
            <li><a href="homepage.html">Home</a></li>
            <li><a href="Products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="registration.html">Sign up</a></li>
            <li><a href="about.html">About us</a></li>
        </ul>
    </nav>
</header>

<main>
    <br>
    <form id="signupForm">
        <div class="container d-flex justify-content-center align-items-center min-vh-100">
            <div class="card p-4" style="max-width: 750px; width: 90%;">
                <h3 class="text-center mb-4" style="color: #ff8c00;">Sign in</h3>

                <div class="mb-3">
                    <label for="fname" class="form-label">First name:</label>
                    <input type="text" class="form-control" id="fname" placeholder="Enter your first name" required>
                </div>

                <div class="mb-3">
                    <label for="lname" class="form-label">Last Name:</label>
                    <input type="text" class="form-control" id="lname" placeholder="Enter your last name" required>
                </div>

                <div class="mb-3">
                    <label for="uname" class="form-label">Username:</label>
                    <input type="text" class="form-control" id="uname" placeholder="Enter your username" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label for="passlog" class="form-label">Create Password:</label>
                    <input type="password" class="form-control" id="passlog" placeholder="Enter your password" required 
                           pattern="^(?=.*[A-Z])(?=.*\d)[A-Za-z\d@$!%*?&]{8,}$" 
                           title="Password must be at least 8 characters long, include at least one uppercase letter and one number.">
                    <div id="strengthMeter" class="strength-meter"></div>
                </div>

                <div class="mb-3">
                    <label for="rpasslog" class="form-label">Repeat Password:</label>
                    <input type="password" class="form-control" id="rpasslog" placeholder="Repeat your password" required>
                </div>

                <div class="mb-3">
                    <label for="date" class="form-label">Date of Birth:</label>
                    <input type="date" class="form-control" id="date" required>
                </div>

                <div class="mb-3">
                    <label for="city" class="form-label">City:</label>
                    <input type="text" class="form-control" id="city" placeholder="Enter your city" required>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Street and Number:</label>
                    <input type="text" class="form-control" id="address" placeholder="Enter your street and number" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn w-100" style="background-color: #ff8c00; color: white;">Sign up</button>
                </div>
            </div>
        </div>
        <br>
    </form>
    

    <div id="successMessage" style="display:none;" class="alert alert-success text-center">
        Your data has been saved successfully!
    </div>

    <p class="text-center mt-3">Already have an account?<a href="Login.html" class="text-orange">Log in </a></p>
    
</main>

<footer>
    <p>Foundations of Web Development-Rahic Emir</p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>

<script>
    
    document.getElementById('signupForm').addEventListener('submit', function(event) {
        event.preventDefault(); 
        
      
        const fname = document.getElementById('fname').value;
        const lname = document.getElementById('lname').value;
        const uname = document.getElementById('uname').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('passlog').value;
        const rpassword = document.getElementById('rpasslog').value;
        const date = document.getElementById('date').value;
        const city = document.getElementById('city').value;
        const address = document.getElementById('address').value;

        
        const formData = {
            fname: fname,
            lname: lname,
            uname: uname,
            email: email,
            password: password,
            rpassword: rpassword,
            date: date,
            city: city,
            address: address
        };

        
        fetch('https://jsonplaceholder.typicode.com/posts', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            
            document.getElementById('successMessage').style.display = 'block';
            
            document.getElementById('signupForm').reset();
        })
        .catch(error => {
            console.error('Error:', error);
        });
    });

    
    document.getElementById('passlog').addEventListener('input', function() {
        const password = document.getElementById('passlog').value;
        const result = zxcvbn(password);
        const strengthMeter = document.getElementById('strengthMeter');
        
        if (result.score === 0) {
            strengthMeter.className = 'strength-meter weak';
        } else if (result.score === 1) {
            strengthMeter.className = 'strength-meter medium';
        } else {
            strengthMeter.className = 'strength-meter strong';
        }
    });

   
</script>
</body>
</html>
