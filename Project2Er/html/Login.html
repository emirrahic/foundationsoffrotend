    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card p-4" style="max-width: 600px; width: 100%;">
            <h3 class="text-center mb-4 "style="color: #ff8c00;">Log in</h3>
            <form>
                
                <div class="mb-3">
                    <label for="email" class="form-label" id="emaillog">Email:</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label" id="passlog">Password:</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
                
                <div class="d-grid">
                    <button class="btn w-100" style="background-color: #ff8c00; color: white;">Log in</button>
                </div>
            </form>
            
            <p class="text-center mt-3">Don't have an account? <a href="registration.html" class="text-orange">Sign in </a></p>
        </div>
